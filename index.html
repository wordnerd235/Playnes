<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Send the full page address with map requests, so a Google key restricted to
         https://<user>.github.io/Playnes/* matches (browsers send only the site by default). -->
    <meta name="referrer" content="no-referrer-when-downgrade" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Playnes" />
    <meta name="theme-color" content="#1d5d9b" />
    <meta name="description" content="A kid-friendly, real-world flying game." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Playnes</title>
  </head>
  <body>
    <div id="world"></div>
    <div id="app"></div>
    <div id="rotate-note">Turn the iPad sideways to fly ✈️</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
