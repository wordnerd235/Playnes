<!doctype html>
<!-- Dev tool: preview the generated plane models. Serve the repo root and open /tools/model-preview.html -->
<html>
<head>
<meta charset="utf-8">
<title>Model preview</title>
<style>body{margin:0;background:#9cc6ea}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"../node_modules/three/build/three.module.js","three/addons/":"../node_modules/three/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
const params = new URLSearchParams(location.search);
const ids = (params.get("ids") || "c172,phenom100,pc12,hondajet,phenom300,pc24,latitude,praetor600,challenger3500,falcon8x,g650er,g700,global8000").split(",");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x667788, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(30, 60, 40);
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: 0x7a8a78 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);
const cols = Math.ceil(Math.sqrt(ids.length));
const loader = new GLTFLoader();
let loaded = 0;
ids.forEach((id, i) => loader.load(`../public/models/${id}.glb`, (g) => {
  const m = g.scene;
  m.position.set((i % cols) * 40 - cols * 20 + 20, 0, -Math.floor(i / cols) * 40);
  m.rotation.y = Number(params.get("yaw") ?? Math.PI * 0.75);
  scene.add(m);
  if (++loaded === ids.length) document.title = "ready";
}));
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.5, 2000);
if (params.get("view") === "close") { cam.position.set(25, 12, 25); cam.lookAt(0, 2, 0); }
else { cam.position.set(60, 90, 140); cam.lookAt(0, 0, -50); }
renderer.setAnimationLoop(() => renderer.render(scene, cam));
</script>
</body>
</html>
